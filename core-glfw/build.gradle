// GLFW の窓と単体ビューア（StandaloneViewer）。窓の描画は OpenGL なので :core-gl を使う。
plugins {
    id 'java-library'
}

ext.publishDescription = 'GLFW window host and StandaloneViewer for EnderFrameLib core (brings core-gl).'

group = engine_group_id
version = engine_version

base {
    archivesName = engine_artifact_prefix + '-core-glfw'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

def lwjglVersion = '3.3.3'

dependencies {
    api project(':core')
    api project(':core-gl')
    api "org.lwjgl:lwjgl-glfw:${lwjglVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 公開設定（A10）は archivesName の後で読む
apply from: rootProject.file('gradle/publish-core-module.gradle')
