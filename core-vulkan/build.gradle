// Vulkan 1.1 の GPU バックエンド（:core の GpuBackendProvider 実装）。Vulkan のコンパイル依存はここにだけ置く。
plugins {
    id 'java-library'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id + '-core-vulkan'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

def lwjglVersion = '3.3.3'

dependencies {
    api project(':core')
    api "org.lwjgl:lwjgl-vulkan:${lwjglVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
