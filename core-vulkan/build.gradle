// Vulkan 1.1 の GPU バックエンド（:core の GpuBackendProvider 実装）。Vulkan のコンパイル依存はここにだけ置く。
plugins {
    id 'java-library'
}

ext.publishDescription = 'Vulkan 1.1 GPU backend for EnderFrameLib core (headless, swapchain, or host-owned VkDevice).'

group = engine_group_id
version = engine_version

base {
    archivesName = engine_artifact_prefix + '-core-vulkan'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

def lwjglVersion = '3.3.3'

dependencies {
    api project(':core')
    api "org.lwjgl:lwjgl-vulkan:${lwjglVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 公開設定（A10）は archivesName の後で読む
apply from: rootProject.file('gradle/publish-core-module.gradle')
