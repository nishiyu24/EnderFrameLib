# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# ModDevGradle の run 設定生成は configuration cache と相性が悪く、
# runClient / runGameTestServer が設定キャッシュの再利用時に壊れる。
# build / test は通るが、開発者が最初に踏むのは run 側なので無効のままにする。
org.gradle.configuration-cache=false
# :core 系だけのタスク（:core:test など）で :mod（NeoForge・Minecraft）を設定しない（計画書 P4-1）。
# 名前を付けずに選んだタスク（`build`・`test`）は全プロジェクトを設定する
org.gradle.configureondemand=true


## エンジン（:core 系）の公開物の座標。独立名への改名は計画書 P4-2（M6 と同時）
engine_group_id=com.nishiyu.enderframelib
engine_version=2.0.0
engine_artifact_prefix=enderframelib
