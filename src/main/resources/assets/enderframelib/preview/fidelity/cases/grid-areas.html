<!-- grid-template-areas の名前で配置する。 -->
<div style="display: grid; width: 300px; grid-template-columns: 100px 200px; grid-template-rows: 20px 40px; grid-template-areas: 'head head' 'side main';">
  <div id="main" style="grid-area: main;"></div><div id="head" style="grid-area: head;"></div><div id="side" style="grid-area: side;"></div>
</div>
