<!-- min-width / max-width は width より強い。両方当たれば min-width が勝つ。 -->
<div id="capped" style="width: 50%; max-width: 100px; height: 10px;"></div>
<div id="floored" style="width: 10px; min-width: 200px; height: 10px;"></div>
<div id="both" style="width: 50px; min-width: 120px; max-width: 80px; height: 10px;"></div>
