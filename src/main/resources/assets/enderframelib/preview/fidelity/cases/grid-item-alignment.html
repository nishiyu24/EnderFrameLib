<!-- justify-items / align-items で、セルより小さいアイテムをセル内で揃える。 -->
<div style="display: grid; width: 200px; grid-template-columns: 100px 100px; grid-template-rows: 40px; justify-items: center; align-items: end;">
  <div id="a" style="width: 20px; height: 10px;"></div>
  <div id="b" style="width: 20px; height: 10px; justify-self: start; align-self: start;"></div>
</div>
