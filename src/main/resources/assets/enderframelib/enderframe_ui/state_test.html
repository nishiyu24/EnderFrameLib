<!--
  Headless State の実機確認用テンプレート（WebScreenGameTest.DevHarness の /efl_dev state open で開く）。
  表示（{{key}} / data-bind / data-if）、クリック・キー入力・ホイールが DOM のイベントとして発火し、
  サーバーのアクションまで届くことを目で見て確かめる。
-->
<html>
<head>
<style>
  body { margin: 0; background: #1e1f24; color: #e8e8e8; font-family: sans-serif; }
  #panel { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 20px; margin: 0; }
  .row { display: flex; gap: 12px; align-items: center; }
  .bar { width: 400px; height: 18px; background: #3a3c44; border-radius: 3px; }
  #fill { height: 100%; background: #4caf50; border-radius: 3px; }
  #toggle { width: 400px; height: 64px; font-size: 18px; background: #3b82f6; color: #fff; border: none; border-radius: 4px; }
  #typed { width: 400px; height: 28px; font-size: 16px; }
  #wheel { width: 400px; height: 70px; overflow-y: scroll; background: #2a2c33; border: 1px solid #555; }
  #wheel div { height: 30px; }
  .on { color: #7ee787; }
</style>
</head>
<body>
<div id="panel">
  <h1>EnderFrame state test — <span id="instance">{{label}}</span></h1>
  <div class="row"><span>status:</span><span id="status" data-bind="status">{{status}}</span>
    <span id="running" class="on" data-if="running">RUNNING</span></div>
  <div class="row"><div class="bar"><div id="fill" data-bind="style.width:progress_css"></div></div>
    <span id="progress">{{progress}}</span></div>
  <div class="row"><span>clicks (server): </span><span id="clicks">{{clicks}}</span>
    <span>wheel (server): </span><span id="wheels">{{wheels}}</span>
    <span>typed (server): </span><span id="typed-echo">{{typed}}</span></div>
  <button id="toggle" onclick="server:toggle">Toggle (click)</button>
  <input id="typed" type="text" oninput="server:typed" placeholder="type here">
  <div id="wheel" onwheel="server:wheel">
    <div>wheel 1</div><div>wheel 2</div><div>wheel 3</div><div>wheel 4</div><div>wheel 5</div><div>wheel 6</div>
  </div>
</div>
</body>
</html>
