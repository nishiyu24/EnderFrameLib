<div class="machine-container" style="width: 250px; height: 180px; background-color: #2b2b2b; color: #ffffff; padding: 10px; border-radius: 4px;">
    <div class="header" style="display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid #444444; padding-bottom: 4px;">
        <span class="title">Electric Crusher</span>
        <span id="status" class="status">Idle</span>
    </div>
    <div class="body" style="display: flex; gap: 10px; margin-top: 10px;">
        <div class="slots" style="display: flex; flex-direction: column; gap: 6px;">
            <div class="slot input" id="slot-input" style="width: 36px; height: 36px; background-color: #1a1a1a; border: 1px solid #555555;"></div>
            <div class="arrow" style="text-align: center;">↓</div>
            <div class="slot output" id="slot-output" style="width: 36px; height: 36px; background-color: #1a1a1a; border: 1px solid #555555;"></div>
        </div>
        <div class="progress-section" style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
            <div class="progress-bar" style="width: 100%; height: 16px; background-color: #444444; border-radius: 2px;">
                <div id="progress" class="progress-fill" style="width: 0%; height: 100%; background-color: #4caf50;"></div>
            </div>
            <span id="progress-text" style="font-size: 11px;">0%</span>
            <div class="energy-bar" style="width: 100%; height: 12px; background-color: #444444; border-radius: 2px;">
                <div id="energy-fill" class="energy-level" style="width: 50%; height: 100%; background-color: #f44336;"></div>
            </div>
            <span id="energy-text" style="font-size: 11px;">5000 / 10000 FE</span>
        </div>
    </div>
    <div class="controls" style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
        <button id="toggle-power" class="btn" onclick="server:toggle_power" style="padding: 4px 8px; background-color: #3b82f6; color: #ffffff; border: none; border-radius: 3px;">Toggle Power</button>
        <span id="mode-text" style="font-size: 11px;">Mode: Normal</span>
    </div>
</div>
