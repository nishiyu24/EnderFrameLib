// Minecraft / NeoForge に依存しない、単体で動くレンダリングコア。
// HTML/CSS の解釈・レイアウト・ディスプレイリスト・ソフトウェア描画・純 LWJGL の GL 描画を含む。
plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
}

group = engine_group_id
version = engine_version

base {
    archivesName = engine_artifact_prefix + '-core'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Jar).configureEach {
    from(rootProject.files('LICENSE', 'NOTICE')) { into 'META-INF' }
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    if (options instanceof StandardJavadocDocletOptions) {
        options.addStringOption('Xdoclint:none', '-quiet')
        options.addBooleanOption('-allow-script-in-comments', true)
    }
}

repositories {
    mavenCentral()
}

def lwjglVersion = '3.3.3'
def lwjglNatives = {
    def os = System.getProperty('os.name').toLowerCase()
    def arch = System.getProperty('os.arch').toLowerCase()
    if (os.contains('win')) return arch.contains('aarch64') || arch.contains('arm') ? 'natives-windows-arm64' : 'natives-windows'
    if (os.contains('mac')) return arch.contains('aarch64') || arch.contains('arm') ? 'natives-macos-arm64' : 'natives-macos'
    return arch.contains('aarch64') ? 'natives-linux-arm64' : 'natives-linux'
}()

dependencies {
    api 'org.jetbrains:annotations:24.1.0'
    api 'org.slf4j:slf4j-api:2.0.9'
    api 'it.unimi.dsi:fastutil:8.5.12'
    api 'org.joml:joml:1.10.5'
    api 'com.google.code.gson:gson:2.10.1' // Minecraft 1.21.1 が持つ版と同じ（EnderConfigManager）
    api 'net.java.dev.jna:jna:5.14.0' // Minecraft 1.21.1 が持つ版と同じ（動画デコーダの JNA）
    api "org.lwjgl:lwjgl:${lwjglVersion}"
    api "org.lwjgl:lwjgl-freetype:${lwjglVersion}"
    // OpenGL・GLFW・Vulkan は持たない（G4）。GPU 実装は :core-gl / :core-vulkan、窓は :core-glfw が提供する

    // ネイティブはテストと、単体で動かすときの実行時に必要（Minecraft 上では本体が持つ）
    testRuntimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
    testRuntimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    testRuntimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    testRuntimeOnly "org.lwjgl:lwjgl-freetype::${lwjglNatives}"

    // テストは GPU 実装を含めて検証する（:core の公開依存には含まれない）
    testImplementation project(':core-gl')
    testImplementation project(':core-vulkan')
    testImplementation project(':core-glfw')
    if (lwjglNatives.startsWith('natives-macos')) {
        testRuntimeOnly "org.lwjgl:lwjgl-vulkan::${lwjglNatives}"
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'

    // テストの補助（src/testFixtures）。:core のテストと :mod のテストが共有する（GoldenFiles・TestBoxes・UiEventFixture）
    testFixturesImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
}

// テストの補助は公開物（Maven の POM・Gradle のモジュール）に載せない
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }

// エンジン再設計 Milestone 0: 利用側に JVM の起動フラグ（プレビュー機能・追加モジュール・ネイティブアクセス許可）も
// 追加ネイティブ依存も要求しない。コンパイルにもテスト実行にも特別なフラグを渡さない（KernelBaselineTest が番をする）。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    defaultCharacterEncoding = 'UTF-8'
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}


// テストはリポジトリ直下を作業ディレクトリにして、core/src/test/resources（フォント・ゴールデン・WPT 等）と
// MOD の同梱の文書（mod/src/main/resources/data/enderframelib/enderframe_ui）を相対パスで読む

// ---- テストの体制（2026-11-19。CONTRIBUTING.md「テストの回し方」）----
//   ./gradlew :core:quickTest              開発中の確認。@Tag("slow")（種を多数回すファズ型）と @Tag("timing") を外し、JVM を分けて並列
//   ./gradlew :core:test                   全件。slow を含めて並列で流し、続けて timing だけを直列の timingTest で流す
//   ./gradlew :core:test --tests '*Foo*'   絞り込み（timingTest も同じ絞り込みで続く。該当なしは素通り）
// 並列はテストのクラスを JVM ごとに振り分けるだけで、1 つの JVM の中は従来どおり直列（static な状態を書き換えるテストがあるため、
// JUnit のスレッド並列は使わない）。本数は -Ptest.forks=N（既定はコア数 / 6、1〜4。2 コアの CI では 1 本＝従来どおり。各テストが内部でワーカーを立てるので、24 コアで 4 本と 6 本は同じ時間〔約 160 秒〕で 4 本の方が CPU の取り合いが少ない）。
// timing を並列の JVM と同時に流すと CPU の取り合いで実時間が揺れるので、timing は必ず test の後に 1 本で流す。
// 実時間で合否を決めるテスト（@Tag("timing")）は、共有ランナーの CI（build.yml・full-tests.yml）では -Ptest.excludeTags=timing で外す。
// TimingTagPolicyTest が付け忘れと CI の渡し忘れを見張る。
def excludedTags = project.hasProperty('test.excludeTags') ? project.property('test.excludeTags').toString().split(',').collect { it.trim() }.findAll { it } : []
def testForks = project.hasProperty('test.forks') ? project.property('test.forks').toString().toInteger()
        : Math.max(1, Math.min(4, Runtime.runtime.availableProcessors().intdiv(6)))
// テストがクラスパスの外から（リポジトリ直下からの相対パスで）読むファイル。文書の整合（DocConsistencyTest）・回帰カタログ・
// ラチェット（ソースの走査）・ArchitectureTest・CI のワークフロー（TimingTagPolicyTest）・同梱の HTML など。
// 入力に申告しないと、文書やコメントだけを直したときに test が UP-TO-DATE / FROM-CACHE で素通りする（2026-11-19）。
// :mod の test（mod/build.gradle）も同じ集合を使う
def rootDir = rootProject.projectDir
ext.repoFilesReadByTests = files(
        { rootDir.listFiles().findAll { it.isFile() && it.name.endsWith('.md') } },
        { new File(rootDir, 'core').listFiles().findAll { it.isFile() && it.name.endsWith('.md') } },
        { new File(rootDir, 'mod').listFiles().findAll { it.isFile() && it.name.endsWith('.md') } },
        ['core/src/main/java', 'core-gl/src/main/java', 'core-vulkan/src/main/java', 'core-glfw/src/main/java',
         'mod/src/main/java', 'mod/src/main/resources', 'core/demo/resources', 'core/src/bench-crossengine',
         'core/src/test/java', 'core/src/testFixtures/java', 'mod/src/test/java', '.github/workflows', 'scripts', 'core/baseline', 'docs', 'mod/docs']
                .collect { new File(rootDir, it) }.findAll { it.exists() })
def configureCoreTest = { Test t, List<String> includeTagList, List<String> excludeTagList, int forks ->
    t.inputs.files(repoFilesReadByTests).withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName('repoFilesReadByTests')
    t.testClassesDirs = sourceSets.test.output.classesDirs
    t.classpath = sourceSets.test.runtimeClasspath
    t.useJUnitPlatform {
        if (!includeTagList.isEmpty()) includeTags(*includeTagList)
        if (!excludeTagList.isEmpty()) excludeTags(*excludeTagList)
    }
    t.maxParallelForks = forks
    t.maxHeapSize = '3g' // 既定のヒープでは全件実行が OutOfMemoryError で落ちる
    t.workingDir = rootProject.projectDir
    t.testLogging { showStandardStreams = true }
    ['golden.update', 'fidelity.dump', 'fidelity.export', 'benchmark.enforce', 'benchmark.update', 'benchmark.factor', 'benchmark.slackMs', 'enderframe.gl.recttrees', 'gpu.baseline.exact', 'gpu.baseline.update', 'wpt.v3.update', 'wpt.v3.diag', 'wpt.reftest.diag', 'wpt.reftest.strict', 'wpt.reftest.dump', 'enderframe.parser.dropnewlinews', 'ratchet.update', 'oracle.seeds', 'verify.oracle'].each { key ->
        def value = System.getProperty(key)
        if (value != null) t.systemProperty key, value
        t.inputs.property key, value ?: ''
    }
    // T4: 公開 API の署名の表（api-signatures.txt）を書き直す。差分を目で見てからコミットする
    if (project.hasProperty('api.update')) t.systemProperty 'api.update', 'true'
    t.inputs.property 'api.update', project.hasProperty('api.update')
}

def timingTest = tasks.register('timingTest', Test) {
    group = 'verification'
    description = '実時間で合否を決めるテスト（@Tag("timing")）だけを 1 本の JVM で流す（test の後に自動で続く）'
    configureCoreTest(it, ['timing'], excludedTags.findAll { it != 'timing' }, 1)
    // test と同じ --tests の絞り込みを引き継ぐ。絞り込んだ結果に timing が無くても失敗にしない
    filter.failOnNoMatchingTests = false
    onlyIf('-Ptest.excludeTags=timing で外した') { !excludedTags.contains('timing') }
    mustRunAfter tasks.named('test')
}

tasks.named('test', Test) {
    configureCoreTest(it, [], (excludedTags + ['timing']).unique(), testForks)
    finalizedBy timingTest
    // --tests の絞り込みを timingTest へ写す（コマンド行の --tests は test にしか掛からない）
    doFirst {
        def patterns = filter.commandLineIncludePatterns
        patterns.each { timingTest.get().filter.includeTestsMatching(it) }
    }
}

tasks.register('quickTest', Test) {
    group = 'verification'
    description = '開発中の確認: @Tag("slow") と @Tag("timing") を外した全テストを並列で流す（push 前は test / ci-linux.ps1）'
    configureCoreTest(it, [], (excludedTags + ['slow', 'timing']).unique(), testForks)
    dependsOn 'verifyCoreDependencyGraph'
}

