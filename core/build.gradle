// Minecraft / NeoForge に依存しない、単体で動くレンダリングコア。
// HTML/CSS の解釈・レイアウト・ディスプレイリスト・ソフトウェア描画・純 LWJGL の GL 描画を含む。
plugins {
    id 'java-library'
    id 'maven-publish'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id + '-core'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

def lwjglVersion = '3.3.3'
def lwjglNatives = {
    def os = System.getProperty('os.name').toLowerCase()
    def arch = System.getProperty('os.arch').toLowerCase()
    if (os.contains('win')) return arch.contains('aarch64') || arch.contains('arm') ? 'natives-windows-arm64' : 'natives-windows'
    if (os.contains('mac')) return arch.contains('aarch64') || arch.contains('arm') ? 'natives-macos-arm64' : 'natives-macos'
    return arch.contains('aarch64') ? 'natives-linux-arm64' : 'natives-linux'
}()

dependencies {
    api 'org.jetbrains:annotations:24.1.0'
    api 'org.slf4j:slf4j-api:2.0.9'
    api 'it.unimi.dsi:fastutil:8.5.12'
    api 'org.joml:joml:1.10.5'
    api 'com.google.code.gson:gson:2.10.1' // Minecraft 1.21.1 が持つ版と同じ（EnderConfigManager）
    api 'net.java.dev.jna:jna:5.14.0' // Minecraft 1.21.1 が持つ版と同じ（動画デコーダの JNA）
    api "org.lwjgl:lwjgl:${lwjglVersion}"
    api "org.lwjgl:lwjgl-glfw:${lwjglVersion}"
    api "org.lwjgl:lwjgl-opengl:${lwjglVersion}"
    api "org.lwjgl:lwjgl-freetype:${lwjglVersion}"

    // ネイティブはテストと、単体で動かすときの実行時に必要（Minecraft 上では本体が持つ）
    testRuntimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
    testRuntimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    testRuntimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    testRuntimeOnly "org.lwjgl:lwjgl-freetype::${lwjglNatives}"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// テストはリポジトリ直下の src/test/resources（フォント・ゴールデン等）と src/main/resources を相対パスで読む
sourceSets.test.resources.srcDir rootProject.file('src/test/resources')

tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir = rootProject.projectDir
    testLogging { showStandardStreams = true }
    ['golden.update', 'fidelity.dump', 'fidelity.export', 'benchmark.enforce', 'benchmark.update', 'benchmark.factor', 'benchmark.slackMs'].each { key ->
        def value = System.getProperty(key)
        if (value != null) systemProperty key, value
        inputs.property key, value ?: ''
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id + '-core'
        }
    }
    repositories {
        maven { url "file://${rootProject.projectDir}/repo" }
    }
}

// 単体ビューア（Minecraft なしで HTML を GLFW の窓／PNG に出す）。LWJGL のネイティブは公開物に混ぜないので別の設定に置く
configurations {
    viewerRuntime {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom implementation
    }
}
dependencies {
    viewerRuntime "org.lwjgl:lwjgl::${lwjglNatives}"
    viewerRuntime "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    viewerRuntime "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    viewerRuntime "org.lwjgl:lwjgl-freetype::${lwjglNatives}"
    viewerRuntime 'org.slf4j:slf4j-simple:2.0.9'
}

// ./gradlew :core:runViewer --args="page.html 1280 800"   /   --args="page.html 1280 800 --png out.png --after 5000"
tasks.register('runViewer', JavaExec) {
    group = 'application'
    description = 'HTML を GLFW の窓（または --png で画像）に表示する単体ビューア'
    classpath = sourceSets.main.output + configurations.viewerRuntime
    mainClass = 'com.nishiyu.enderframelib.common.StandaloneViewer'
    workingDir = rootProject.projectDir
}

// デモ（公開物には入れない）: ライブラリだけで動くテストサイト。Java が DOM を操作する。
//   ./gradlew :core:runShowcase                                   窓で表示
//   ./gradlew :core:runShowcase --args="--png out.png --after 3000"   窓なしで PNG
sourceSets {
    demo {
        java.srcDir 'demo/java'
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.viewerRuntime
    }
}
tasks.register('runShowcase', JavaExec) {
    group = 'application'
    description = 'ライブラリだけで動くテストサイト（Java が DOM を操作）を窓または PNG に出す'
    classpath = sourceSets.demo.output + sourceSets.demo.runtimeClasspath
    mainClass = 'com.nishiyu.enderframelib.demo.ShowcaseApp'
    if (System.getProperty('showcase.jfr') != null) jvmArgs "-XX:StartFlightRecording=filename=${System.getProperty('showcase.jfr')},settings=profile"
    ['showcase.nogrid', 'showcase.inject', 'showcase.notimers', 'showcase.off', 'showcase.verbose', 'enderframe.paint.nomemo', 'showcase.gridms'].each { k -> if (System.getProperty(k) != null) systemProperty k, System.getProperty(k) }
    workingDir = rootProject.projectDir
}
