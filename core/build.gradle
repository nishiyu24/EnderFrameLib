// Minecraft / NeoForge に依存しない、単体で動くレンダリングコア。
// HTML/CSS の解釈・レイアウト・ディスプレイリスト・ソフトウェア描画・純 LWJGL の GL 描画を含む。
plugins {
    id 'java-library'
    id 'maven-publish'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id + '-core'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    if (options instanceof StandardJavadocDocletOptions) {
        options.addStringOption('Xdoclint:none', '-quiet')
        options.addBooleanOption('-allow-script-in-comments', true)
    }
}

repositories {
    mavenCentral()
}

def lwjglVersion = '3.3.3'
def lwjglNatives = {
    def os = System.getProperty('os.name').toLowerCase()
    def arch = System.getProperty('os.arch').toLowerCase()
    if (os.contains('win')) return arch.contains('aarch64') || arch.contains('arm') ? 'natives-windows-arm64' : 'natives-windows'
    if (os.contains('mac')) return arch.contains('aarch64') || arch.contains('arm') ? 'natives-macos-arm64' : 'natives-macos'
    return arch.contains('aarch64') ? 'natives-linux-arm64' : 'natives-linux'
}()

dependencies {
    api 'org.jetbrains:annotations:24.1.0'
    api 'org.slf4j:slf4j-api:2.0.9'
    api 'it.unimi.dsi:fastutil:8.5.12'
    api 'org.joml:joml:1.10.5'
    api 'com.google.code.gson:gson:2.10.1' // Minecraft 1.21.1 が持つ版と同じ（EnderConfigManager）
    api 'net.java.dev.jna:jna:5.14.0' // Minecraft 1.21.1 が持つ版と同じ（動画デコーダの JNA）
    api "org.lwjgl:lwjgl:${lwjglVersion}"
    api "org.lwjgl:lwjgl-glfw:${lwjglVersion}"
    api "org.lwjgl:lwjgl-opengl:${lwjglVersion}"
    api "org.lwjgl:lwjgl-freetype:${lwjglVersion}"

    // ネイティブはテストと、単体で動かすときの実行時に必要（Minecraft 上では本体が持つ）
    testRuntimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
    testRuntimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    testRuntimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    testRuntimeOnly "org.lwjgl:lwjgl-freetype::${lwjglNatives}"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'
}

// エンジン再設計 Milestone 0: 利用側に JVM の起動フラグ（プレビュー機能・追加モジュール・ネイティブアクセス許可）も
// 追加ネイティブ依存も要求しない。コンパイルにもテスト実行にも特別なフラグを渡さない（KernelBaselineTest が番をする）。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    defaultCharacterEncoding = 'UTF-8'
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}


// テストはリポジトリ直下の src/test/resources（フォント・ゴールデン等）と src/main/resources を相対パスで読む
sourceSets.test.resources.srcDir rootProject.file('src/test/resources')

tasks.named('test', Test) {
    useJUnitPlatform()
    maxHeapSize = '3g' // 既定のヒープでは全件実行が OutOfMemoryError で落ちる
    systemProperty 'enderframe.paint.verifystamps', 'true'
    // float メモ（BlockLayoutEngine.containsFloats）が使える場面でも走査し直し、食い違えば AssertionError（無効化の付け漏れの検出）
    systemProperty 'enderframe.layout.verifyfloats', 'true'
    workingDir = rootProject.projectDir
    testLogging { showStandardStreams = true }
    ['golden.update', 'fidelity.dump', 'fidelity.export', 'benchmark.enforce', 'benchmark.update', 'benchmark.factor', 'benchmark.slackMs', 'enderframe.gl.recttrees'].each { key ->
        def value = System.getProperty(key)
        if (value != null) systemProperty key, value
        inputs.property key, value ?: ''
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id + '-core'
            pom {
                name = 'EnderFrameLib Core'
                description = 'High-performance pure-Java HTML/CSS UI and layout engine.'
                url = 'https://github.com/nishiyu24/EnderFrameLib'
                licenses {
                    license {
                        name = 'GNU Lesser General Public License, Version 3.0'
                        url = 'https://www.gnu.org/licenses/lgpl-3.0.html'
                    }
                }
                developers {
                    developer {
                        id = 'nishiyu'
                        name = 'nishiyu'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/nishiyu24/EnderFrameLib.git'
                    developerConnection = 'scm:git:ssh://github.com:nishiyu24/EnderFrameLib.git'
                    url = 'https://github.com/nishiyu24/EnderFrameLib'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'localRepo'
            url = "file://${rootProject.projectDir}/repo"
        }
        if (System.getenv('MAVEN_REPO_URL') != null) {
            maven {
                name = 'remote'
                url = uri(System.getenv('MAVEN_REPO_URL'))
                credentials {
                    username = System.getenv('MAVEN_USERNAME') ?: System.getenv('OSSRH_USERNAME')
                    password = System.getenv('MAVEN_PASSWORD') ?: System.getenv('OSSRH_PASSWORD')
                }
            }
        }
    }
}

// 単体ビューア（Minecraft なしで HTML を GLFW の窓／PNG に出す）。LWJGL のネイティブは公開物に混ぜないので別の設定に置く
configurations {
    viewerRuntime {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom implementation
    }
}
dependencies {
    viewerRuntime "org.lwjgl:lwjgl::${lwjglNatives}"
    viewerRuntime "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    viewerRuntime "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    viewerRuntime "org.lwjgl:lwjgl-freetype::${lwjglNatives}"
    viewerRuntime 'org.slf4j:slf4j-simple:2.0.9'
}

// ./gradlew :core:runViewer --args="page.html 1280 800"   /   --args="page.html 1280 800 --png out.png --after 5000"
tasks.register('runViewer', JavaExec) {
    group = 'application'
    description = 'HTML を GLFW の窓（または --png で画像）に表示する単体ビューア'
    classpath = sourceSets.main.output + configurations.viewerRuntime
    mainClass = 'com.nishiyu.enderframelib.common.StandaloneViewer'
    workingDir = rootProject.projectDir
}

// デモ（公開物には入れない）: ライブラリだけで動くテストサイト。Java が DOM を操作する。
//   ./gradlew :core:runShowcase                                   窓で表示
//   ./gradlew :core:runShowcase --args="--png out.png --after 3000"   窓なしで PNG
sourceSets {
    demo {
        java.srcDir 'demo/java'
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.viewerRuntime
    }
}
tasks.register('runShowcase', JavaExec) {
    group = 'application'
    description = 'ライブラリだけで動くテストサイト（Java が DOM を操作）を窓または PNG に出す'
    classpath = sourceSets.demo.output + sourceSets.demo.runtimeClasspath
    mainClass = 'com.nishiyu.enderframelib.demo.ShowcaseApp'
    if (System.getProperty('showcase.jfr') != null) jvmArgs "-XX:StartFlightRecording=filename=${System.getProperty('showcase.jfr')},settings=profile"
    ['showcase.nogrid', 'showcase.inject', 'showcase.notimers', 'showcase.off', 'showcase.verbose', 'enderframe.paint.nomemo', 'showcase.gridms'].each { k -> if (System.getProperty(k) != null) systemProperty k, System.getProperty(k) }
    workingDir = rootProject.projectDir
}

tasks.register('runCatalog', JavaExec) {
    group = 'application'
    description = 'カタログベンチサイト（多数カード・React スタイル DSL）を窓または PNG に出す'
    classpath = sourceSets.demo.output + sourceSets.demo.runtimeClasspath
    mainClass = 'com.nishiyu.enderframelib.demo.CatalogApp'
    ['catalog.items'].each { k -> if (System.getProperty(k) != null) systemProperty k, System.getProperty(k) }
    workingDir = rootProject.projectDir
}

tasks.register('runNoHtmlSite', JavaExec) {
    group = 'application'
    description = 'HTML ファイルも HTML 文字列も使わず React DSL だけで 1 から構築するデモサイトを窓または PNG に出す'
    classpath = sourceSets.demo.output + sourceSets.demo.runtimeClasspath
    mainClass = 'com.nishiyu.enderframelib.demo.NoHtmlSiteApp'
    workingDir = rootProject.projectDir
}

// ---- 計測（MEASUREMENT.md）----
// JMH のマイクロベンチと、本番の経路の段別プロファイル。公開物には入れない。
//   ./gradlew :core:jmh                                   全部（遅い。数分）
//   ./gradlew :core:jmh -Pjmh.args="PipelineBench.restyle -p doc=showcase -f 1 -wi 2 -i 3 -prof gc"
//   ./gradlew :core:profile -Pprofile.args="large-list 400 --mutate" [-Pprofile.jfr=build/profile.jfr]
sourceSets {
    jmh {
        java.srcDir 'src/jmh/java'
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath + configurations.viewerRuntime
    }
}
dependencies {
    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}
tasks.register('jmh', JavaExec) {
    group = 'verification'
    description = 'JMH マイクロベンチ（パイプライン各段・CPU ラスタ）'
    classpath = sourceSets.jmh.output + sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    workingDir = rootProject.projectDir
    if (project.hasProperty('jmh.args')) args(project.property('jmh.args').toString().split(' ').findAll { !it.isEmpty() })
}
tasks.register('profile', JavaExec) {
    group = 'verification'
    description = '本番の経路で段別の所要時間を表にする（PipelineProfileMain）。-Pprofile.jfr=ファイル で JFR も取る'
    classpath = sourceSets.jmh.output + sourceSets.jmh.runtimeClasspath
    mainClass = project.findProperty('profile.main') ?: 'com.nishiyu.enderframelib.bench.PipelineProfileMain'
    workingDir = rootProject.projectDir
    if (project.hasProperty('profile.jfr')) jvmArgs "-XX:StartFlightRecording=filename=${project.property('profile.jfr')},settings=profile"
    if (project.hasProperty('profile.args')) args(project.property('profile.args').toString().split(' ').findAll { !it.isEmpty() })
}

// デモ・計測用のソースが腐らないよう、check でコンパイルだけは通す（実行はしない）
tasks.named('check') { dependsOn 'compileDemoJava', 'compileJmhJava' }
