// G4: :core の依存グラフに OpenGL・GLFW・Vulkan が無いことをビルドで検査する（利用者へ伝わる api / 実行時の両方）。
// GPU が要る利用者は :core-gl / :core-vulkan / :core-glfw を足す。足さなければ SOFTWARE だけが動く。
def forbiddenGraphicsArtifacts = ['lwjgl-opengl', 'lwjgl-glfw', 'lwjgl-vulkan']
tasks.register('verifyCoreDependencyGraph') {
    group = 'verification'
    description = ':core の compile / runtime 依存に lwjgl-opengl・lwjgl-glfw・lwjgl-vulkan が含まれないことを検査する'
    def compileNames = configurations.compileClasspath.incoming.artifactView { lenient = true }.artifacts.resolvedArtifacts
    def runtimeNames = configurations.runtimeClasspath.incoming.artifactView { lenient = true }.artifacts.resolvedArtifacts
    doLast {
        def bad = []
        [compileNames: compileNames, runtimeNames: runtimeNames].each { label, artifacts ->
            artifacts.get().each { a ->
                def name = a.file.name
                if (forbiddenGraphicsArtifacts.any { name.startsWith(it) }) bad << "${label}: ${name}"
            }
        }
        if (!bad.isEmpty()) throw new GradleException(":core の依存グラフに GPU/窓のライブラリが混ざっている（G4 違反）: ${bad}")
    }
}
tasks.named('check') { dependsOn 'verifyCoreDependencyGraph' }
tasks.named('test') { dependsOn 'verifyCoreDependencyGraph' }

// G4: :core だけのクラスパス（GPU 実装・窓・OpenGL・GLFW・Vulkan のどれも無い）で SOFTWARE が動き、GPU 指定は
// 足すべきモジュールを名指しして失敗することを、実際に別 JVM で確かめる。
configurations {
    coreOnlyRuntime {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom implementation
        attributes { attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME)) }
    }
}
dependencies {
    coreOnlyRuntime "org.lwjgl:lwjgl::${lwjglNatives}"
    coreOnlyRuntime "org.lwjgl:lwjgl-freetype::${lwjglNatives}"
    coreOnlyRuntime 'org.slf4j:slf4j-simple:2.0.9'
}
sourceSets {
    coreOnlySmoke {
        java.srcDir 'src/coreOnlySmoke/java'
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.coreOnlyRuntime
    }
}
tasks.register('runCoreOnlySmoke', JavaExec) {
    group = 'verification'
    description = ':core だけのクラスパスで SOFTWARE が動き、GPU / 窓の指定が足すモジュール名つきで失敗することを確かめる'
    classpath = sourceSets.coreOnlySmoke.output + sourceSets.coreOnlySmoke.runtimeClasspath
    mainClass = 'com.nishiyu.enderframelib.smoke.CoreOnlySmoke'
    workingDir = rootProject.projectDir
}
tasks.named('check') { dependsOn 'runCoreOnlySmoke' }

// 計測を Gradle を介さずに繰り返し回すためのクラスパス（1 行 1 要素）を build/profile-classpath.txt に書く。
// 計測中に別の作業が core/build を再ビルドすると途中でクラスが消えるので、スクリプトはこの一覧を写しへ複製して使う。
tasks.register('profileClasspath') {
    group = 'verification'
    description = 'profile / jmh と同じ実行時クラスパスを build/profile-classpath.txt に書く'
    dependsOn 'jmhClasses'
    def cp = sourceSets.jmh.output + sourceSets.jmh.runtimeClasspath
    def out = layout.buildDirectory.file('profile-classpath.txt')
    outputs.file(out)
    outputs.upToDateWhen { false }
    doLast {
        out.get().asFile.text = cp.files.findAll { it.exists() }.collect { it.absolutePath }.join('\n') + '\n'
    }
}

// ---- Track P1b: コールド起動の AOT キャッシュ（JEP 483 / 514）----
// エンジンのコンパイル・テスト・MOD は Java 21 のまま。JDK 25 はこのタスクの子 JVM（訓練と計測）だけが使い、
// 実行時に初めて解決する（他のタスクの設定では取りに行かない）。AOT キャッシュはクラスパスが jar だけのときしか使えないので、
// 計測用のクラス（jmh）も jar にまとめる。
//   ./gradlew :core:coldStartAb                                  訓練（無ければ）→ JDK 21 / 25 / 25+AOT の交互 A/B
//   ./gradlew :core:coldStartAb -Pab.rounds=7 -Pab.retrain -Pab.doc=large-list-2000 -Pab.fonts=fallback
def jmhJar = tasks.register('jmhJar', Jar) {
    archiveClassifier = 'jmh'
    from sourceSets.jmh.output
    destinationDirectory = layout.buildDirectory.dir('aot')
}
tasks.register('coldStartAb', JavaExec) {
    group = 'verification'
    description = 'コールド起動の交互 A/B: JDK 21 / JDK 25 / JDK 25 + AOT キャッシュ（ColdStartAbMain）'
    dependsOn tasks.named('jar'), jmhJar
    classpath = sourceSets.jmh.output + sourceSets.jmh.runtimeClasspath
    mainClass = 'com.nishiyu.enderframelib.bench.ColdStartAbMain'
    workingDir = rootProject.projectDir
    def java21 = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    def java25 = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    def mainDirs = sourceSets.main.output
    def runtime = sourceSets.jmh.runtimeClasspath
    def coreJar = tasks.named('jar').flatMap { it.archiveFile }
    def benchJar = jmhJar.flatMap { it.archiveFile }
    def aotFile = layout.buildDirectory.file('aot/coldstart.aot')
    outputs.upToDateWhen { false }
    jvmArgumentProviders.add({
        def dirs = mainDirs.files
        def jars = [coreJar.get().asFile, benchJar.get().asFile] +
                runtime.files.findAll { it.isFile() && it.name.endsWith('.jar') && !dirs.contains(it) }
        def props = [
                "-Dab.java21=${java21.get().executablePath.asFile.absolutePath}",
                "-Dab.java25=${java25.get().executablePath.asFile.absolutePath}",
                "-Dab.cp=${jars.collect { it.absolutePath }.join(File.pathSeparator)}",
                "-Dab.aot=${aotFile.get().asFile.absolutePath}"]
        ['ab.rounds', 'ab.doc', 'ab.fonts', 'ab.train'].each { k -> if (project.hasProperty(k)) props << "-D${k}=${project.property(k)}" }
        if (project.hasProperty('ab.retrain')) props << '-Dab.retrain=true'
        props.collect { it.toString() }
    } as CommandLineArgumentProvider)
}

tasks.register('memoryAndLatencyGate', JavaExec) {
    group = 'verification'
    description = '保持ヒープ（MB）と交互 A/B 実行時間（ms）のみを監視する回帰ゲート（MemoryAndLatencyGate）'
    classpath = sourceSets.test.output + sourceSets.test.runtimeClasspath
    mainClass = 'com.nishiyu.enderframelib.core.MemoryAndLatencyGate'
    workingDir = rootProject.projectDir
    if (project.hasProperty('gate.update')) systemProperty 'gate.update', 'true'
    if (project.hasProperty('gate.enforceTiming')) systemProperty 'gate.enforceTiming', 'true'
    if (project.hasProperty('gate.only')) systemProperty 'gate.only', project.property('gate.only').toString()
    if (project.hasProperty('gate.base')) systemProperty 'gate.base', project.property('gate.base').toString()
}

// M2c-1: ビューの保持ヒープを段ごとに分ける診断（V3HeapBreakdownMain）。
//   ./gradlew :core:heapBreakdown [-Pheap.doc=varied-list-2000] [-Pheap.scenario=open|hover] [-Pheap.detail=true]
tasks.register('heapBreakdown', JavaExec) {
    group = 'verification'
    description = 'ビューの保持ヒープの段ごとの内訳（V3HeapBreakdownMain）'
    classpath = sourceSets.test.output + sourceSets.test.runtimeClasspath
    mainClass = 'com.nishiyu.enderframelib.common.V3HeapBreakdownMain'
    workingDir = rootProject.projectDir
    jvmArgs '-Xmx1g', '-Denderframe.threads=1'
    ['heap.doc', 'heap.scenario', 'heap.detail'].each { k -> if (project.hasProperty(k)) systemProperty k, project.property(k).toString() }
}

// A1: 時間に依らない量（1 フレームの確保量・近道の経路の回数）の回帰ゲート。シナリオごとに新しい JVM を立てるので check には
// 繋がず、CI（build.yml）と手元から明示的に回す。
//   ./gradlew :core:costGate                       判定
//   ./gradlew :core:costGate -Pcostgate.update     基準値（core/src/bench-crossengine/costgate-baseline.txt）を書き換える
tasks.register('costGate', JavaExec) {
    group = 'verification'
    description = '確保量と経路の回数の回帰ゲート（CostGateMain）。時間は見ない'
    classpath = sourceSets.jmh.output + sourceSets.jmh.runtimeClasspath
    mainClass = 'com.nishiyu.enderframelib.bench.CostGateMain'
    workingDir = rootProject.projectDir
    if (project.hasProperty('costgate.update')) systemProperty 'costgate.update', 'true'
    if (project.hasProperty('costgate.tolerance')) systemProperty 'costgate.tolerance', project.property('costgate.tolerance').toString()
    if (project.hasProperty('costgate.jvmArgs')) systemProperty 'costgate.jvmArgs', project.property('costgate.jvmArgs').toString()
    if (project.hasProperty('costgate.only')) systemProperty 'costgate.only', project.property('costgate.only').toString()
    if (project.hasProperty('costgate.parallel')) systemProperty 'costgate.parallel', project.property('costgate.parallel').toString()
}

// T3: 差分ファズ。乱数の変更列で増分 = 全面を毎手比べ、ずれた種を core/build/fuzz/new-seeds.txt へ書く（夜間。種は日付から）。
// 見つかった種は core/src/test/resources/mutation-seeds.txt へ足すと、MutationSeedRegressionTest が毎回の CI で回す。
//   ./gradlew :core:mutationFuzz                         日付から決まる新しい種
//   ./gradlew :core:mutationFuzz -Pfuzz.seeds=50 -Pfuzz.start=1   種の数と始まり
//   ./gradlew :core:mutationFuzz -Pfuzz.record            ずれた種を表へ直接足す（手元）
tasks.register('mutationFuzz', JavaExec) {
    group = 'verification'
    description = '乱数の変更列で増分と全面の一致を調べ、ずれた種を記録する（MutationFuzz）'
    classpath = sourceSets.test.output + sourceSets.test.runtimeClasspath
    mainClass = 'com.nishiyu.enderframelib.common.MutationFuzz'
    workingDir = rootProject.projectDir
    ['fuzz.seeds', 'fuzz.start'].each { if (project.hasProperty(it)) systemProperty it, project.property(it).toString() }
    if (project.hasProperty('fuzz.record')) systemProperty 'fuzz.record', 'true'
    if (project.hasProperty('fuzz.jvmArgs')) jvmArgs project.property('fuzz.jvmArgs').toString().split(' ')
}

// A10: GPU・窓モジュールも公開物として依存解決できることを確かめる。
//   ./gradlew :core:verifyPublishedModules
// 4 モジュール（:core・:core-gl・:core-vulkan・:core-glfw）を build/repo/ へ公開し、POM の依存（モジュール間・LWJGL の版）を検査したうえで、
// project 依存を持たない別プロジェクト（scripts/consumer-check）が公開物だけで README のクイックスタート 4 例を動かす。
def publishTaskPaths = [':core', ':core-gl', ':core-vulkan', ':core-glfw'].collect { it + ':publishMavenJavaPublicationToLocalRepoRepository' }
def verifyPoms = tasks.register('verifyPublishedPoms') {
    dependsOn publishTaskPaths
    def repoDir = rootProject.file('build/repo')
    def groupPath = engine_group_id.replace('.', '/')
    def ver = engine_version
    doLast {
        def expectedDeps = [
                'enderframelib-core'       : ['org.lwjgl:lwjgl', 'org.lwjgl:lwjgl-freetype'],
                'enderframelib-core-gl'    : ['com.nishiyu.enderframelib:enderframelib-core', 'org.lwjgl:lwjgl-opengl', 'org.lwjgl:lwjgl-glfw'],
                'enderframelib-core-vulkan': ['com.nishiyu.enderframelib:enderframelib-core', 'org.lwjgl:lwjgl-vulkan'],
                'enderframelib-core-glfw'  : ['com.nishiyu.enderframelib:enderframelib-core', 'com.nishiyu.enderframelib:enderframelib-core-gl', 'org.lwjgl:lwjgl-glfw'],
        ]
        // :core は GPU・窓のライブラリを依存に持たない（G4）。逆に GPU・窓の POM が持つ
        def forbiddenInCore = ['lwjgl-opengl', 'lwjgl-glfw', 'lwjgl-vulkan', 'enderframelib-core-gl', 'enderframelib-core-vulkan', 'enderframelib-core-glfw']
        expectedDeps.each { artifact, deps ->
            def dir = new File(repoDir, "${groupPath}/${artifact}/${ver}")
            def pom = new File(dir, "${artifact}-${ver}.pom")
            if (!pom.isFile()) throw new GradleException("公開物が無い: ${pom}")
            ['', '-sources', '-javadoc'].each { suffix ->
                if (!new File(dir, "${artifact}-${ver}${suffix}.jar").isFile()) throw new GradleException("${artifact}${suffix}.jar が無い")
            }
            def xml = new groovy.xml.XmlSlurper().parse(pom)
            def found = xml.dependencies.dependency.collect { "${it.groupId.text()}:${it.artifactId.text()}".toString() }
            deps.each { d ->
                if (!found.contains(d)) throw new GradleException("${artifact} の POM に依存 ${d} が無い（あるのは ${found}）")
            }
            if (artifact == 'enderframelib-core') {
                def bad = found.findAll { f -> forbiddenInCore.any { f.endsWith(it) } }
                if (!bad.isEmpty()) throw new GradleException(":core の POM に GPU・窓の依存が混ざっている: ${bad}")
            }
            ['name', 'description', 'url'].each { f ->
                if (xml."${f}".text().trim().isEmpty()) throw new GradleException("${artifact} の POM に ${f} が無い")
            }
            if (xml.licenses.license.size() == 0 || xml.scm.url.text().isEmpty()) throw new GradleException("${artifact} の POM にライセンスか scm が無い")
        }
    }
}
tasks.register('verifyPublishedModules', GradleBuild) {
    group = 'verification'
    description = 'GPU・窓モジュールを含む公開物だけで、別プロジェクトが README のクイックスタートを動かせることを確かめる（A10）'
    dependsOn verifyPoms
    dir = rootProject.file('scripts/consumer-check')
    tasks = ['run']
    startParameter.projectProperties = ['efl.version': engine_version.toString()]
}
