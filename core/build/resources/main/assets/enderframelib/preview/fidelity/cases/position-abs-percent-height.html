<div id="rel" style="position: relative; width: 300px; height: 40px;">
  <div id="abs" style="position: absolute; top: 0; bottom: 10px; left: 0; width: 50px;"><div id="ac" style="height: 50%;"></div></div>
  <div id="abs2" style="position: absolute; top: 5px; bottom: 5px; left: 60px; width: 50px; padding: 5px 0;"><div id="ac2" style="height: 100%;"></div></div>
</div>
