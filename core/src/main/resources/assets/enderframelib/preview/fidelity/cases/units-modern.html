<!-- lh / rlh / svh / lvh / dvh / svw: 行の高さとビューポート（320x200）が基準の新しい単位。 -->
<style>
  html { line-height: 24px; }
  #a { line-height: 20px; width: 3lh; height: 10px; }
  #b { width: 2rlh; height: 10px; }
  #c { width: 10svw; height: 10svh; }
  #d { width: 50lvw; height: 10lvh; }
  #e { width: 25dvw; height: 10dvh; }
  #f { width: 1lh; height: 1lh; line-height: 30px; }
</style>
<div id="a"></div>
<div id="b"></div>
<div id="c"></div>
<div id="d"></div>
<div id="e"></div>
<div id="f"></div>
