<!-- grid-column / grid-row の線番号指定。負の番号は末尾から数える。 -->
<div style="display: grid; width: 300px; grid-template-columns: 100px 100px 100px; grid-template-rows: 20px 20px;">
  <div id="a" style="grid-column: 2 / 4; grid-row: 2;"></div>
  <div id="b" style="grid-column: 1 / -1; grid-row: 1;"></div>
</div>
