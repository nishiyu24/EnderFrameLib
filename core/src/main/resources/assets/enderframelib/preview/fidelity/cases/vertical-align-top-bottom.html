<!-- vertical-align: top / bottom は行ボックスの上端・下端に揃える。 -->
<div id="line" style="width: 300px; font-size: 0;">
  <span id="tall" style="display: inline-block; width: 20px; height: 40px;"></span>
  <span id="top" style="display: inline-block; width: 20px; height: 10px; vertical-align: top;"></span>
  <span id="bottom" style="display: inline-block; width: 20px; height: 10px; vertical-align: bottom;"></span>
</div>
