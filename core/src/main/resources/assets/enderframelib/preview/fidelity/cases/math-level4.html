<!-- 数学関数 Level 4: round / mod / rem / abs / sign / 三角関数 / pow / sqrt / hypot / log。 -->
<style>
  div { height: 10px; }
  #a { width: round(up, 33px, 10px); }
  #b { width: round(nearest, 35px, 10px); }
  #c { width: round(down, 39px, 10px); }
  #d { width: round(to-zero, 39px, 10px); }
  #e { width: round(30px, 7px); }
  #f { width: mod(17px, 5px); }
  #g { width: calc(rem(17px, 5px) * 10); }
  #h { width: abs(-12px); }
  #i { width: calc(sign(-3px) * -25px); }
  #j { width: calc(sin(90deg) * 60px); }
  #k { width: calc(cos(0deg) * 70px); }
  #l { width: calc(pow(2, 3) * 11px); }
  #m { width: calc(sqrt(81) * 1px); }
  #n { width: hypot(30px, 40px); }
  #o { width: calc(log(100, 10) * 17px); }
  #p { width: mod(-7px, 3px); }
</style>
<div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div>
<div id="e"></div><div id="f"></div><div id="g"></div><div id="h"></div>
<div id="i"></div><div id="j"></div><div id="k"></div><div id="l"></div>
<div id="m"></div><div id="n"></div><div id="o"></div><div id="p"></div>
