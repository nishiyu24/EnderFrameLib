  <div style="display: table-row;">
    <div id="a" style="display: table-cell; width: 100px; height: 20px;"></div>
    <div id="b" style="display: table-cell; height: 20px;"></div>
    <div id="c" style="display: table-cell; height: 20px;"></div>
  </div>
</div>
