<!-- vertical-align: middle は箱の中央を親のベースライン + x-height/2 に置く（font-size: 0 では 0）。 -->
<div id="line" style="width: 300px; font-size: 0;">
  <span id="tall" style="display: inline-block; width: 20px; height: 40px;"></span>
  <span id="mid" style="display: inline-block; width: 20px; height: 10px; vertical-align: middle;"></span>
</div>
