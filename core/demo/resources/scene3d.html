<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>3D demo</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; background: #0b1020; color: #e5e7eb; }
  header { position: absolute; left: 0; top: 0; right: 0; height: 56px; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: #111936; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header .note { font-size: 12px; color: #94a3b8; }
  main { position: absolute; left: 0; top: 56px; right: 0; bottom: 0; padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch; overflow-y: auto; overflow-x: hidden; }
  .panel { background: #111936; border-radius: 14px; padding: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.4); display: flex; flex-direction: column; }
  .panel h2 { font-size: 13px; margin: 0 0 10px; color: #94a3b8; font-weight: normal; flex: none; }
  .grid-panel { flex: 1.7 1 520px; min-height: 440px; }
  #grid { width: 100%; flex: 1; min-height: 360px; border-radius: 10px; display: block; }
  .side { flex: 1 1 340px; display: flex; flex-direction: column; gap: 20px; min-height: 440px; }
  .side .panel { flex: 1; }
  #model { width: 100%; flex: 1; min-height: 260px; border-radius: 10px; display: block; }
  button { font-size: 13px; padding: 6px 14px; border: 0; border-radius: 8px; background: #38bdf8; color: #082f49; cursor: pointer; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; color: #94a3b8; flex: none; }
</style>
</head>
<body>
<header>
  <h1>3D シーン（&lt;scene-3d&gt;）</h1>
  <span class="note">GGX PBR・glTF・ソフトウェア / GL / Vulkan で同じ絵</span>
</header>
<main>
  <div class="panel grid-panel">
    <h2>左から右へ粗さ 0.15 → 0.95、上から下へ 金属度 1 → 0（ドラッグ・ホイール・クリック可）</h2>
    <scene-3d id="grid"></scene-3d>
    <div class="row"><span>選択中:</span><span id="gridPicked">なし</span></div>
  </div>
  <div class="side">
    <div class="panel">
      <h2>glTF の角錐（ドラッグで回転・クリックで選択）</h2>
      <scene-3d id="model"></scene-3d>
      <div class="row"><span>選択中:</span><span id="picked">なし</span></div>
      <div class="row"><button id="spin">回転 ON/OFF</button><span id="state">回転中</span></div>
      <div class="row"><button id="bloom">Bloom 切替</button><span id="bloomState">Bloom ON</span></div>
    </div>
  </div>
</main>
</body>
</html>
