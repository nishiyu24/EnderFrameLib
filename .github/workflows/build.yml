name: build

# 毎回の CI は「クリーンな checkout でビルド・パッケージ・各種検査が通るか」だけを見る（数分）。
# 全テストは build 環境（GPU なし・書体が開発機と違う Linux）では環境差で落ちやすく、判定の価値が低いので毎回は回さない。
# 全テストは開発機（pre-push フック・scripts/ci-linux.ps1）と、手動・夜間の full-tests ワークフローで回す。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew は Windows 上でコミットされており実行ビットが立っていないため、ここで付与する
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # テストを除く全て: 全モジュールのコンパイル・JAR（サービスファイルの結合と検査）・ビルド時 SPIR-V 検証・
      # :core の依存グラフ検査（GL/GLFW/Vulkan が入っていないこと）・:core 単独のスモーク・デモ/計測のコンパイル
      - name: Build and verify (no tests)
        run: ./gradlew build -x test --stacktrace

      # サーバー側のセッション寿命（ログアウト・サーバー停止で static マップが空に戻るか）は
      # Minecraft を起動しないと確認できないため、ここで専用サーバーを 1 回走らせる。
      # このテストは実際にサーバー停止時のクラッシュを 1 件検出している。
      - name: Game test server
        run: ./gradlew runGameTestServer --stacktrace
