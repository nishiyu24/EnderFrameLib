name: build

# 毎回の CI は「クリーンな checkout でビルド・パッケージ・各種検査が通るか」に加えて、環境に依らない回帰の番を回す:
#   - :core のテスト（GPU・OS の書体に依るテストは、無い環境では自分で中断＝skip する。ソフトウェア描画と内蔵書体の部分が走る）。
#     実時間で合否を決めるテスト（@Tag("timing")）は共有ランナーの混み具合で揺れるので -Ptest.excludeTags=timing で外す（開発機では流す）
#   - 確保量と近道の経路の回数の回帰ゲート（:core:costGate。時間は機械ごとに揺れるので見ない）
# :mod（NeoForge の MOD）側のテストと、時間の基準値（benchmark）は、手動・夜間の full-tests ワークフローと開発機
# （pre-push フック・scripts/ci-linux.ps1）で回す。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew は Windows 上でコミットされており実行ビットが立っていないため、ここで付与する
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # テストを除く全て: 全モジュールのコンパイル・JAR（サービスファイルの結合と検査）・ビルド時 SPIR-V 検証・
      # :core の依存グラフ検査（GL/GLFW/Vulkan が入っていないこと）・:core 単独のスモーク・デモ/計測のコンパイル
      - name: Build and verify (no tests)
        run: ./gradlew build -x test --stacktrace

      # P4-1 のゲート: :core 系だけのタスクでは :mod（NeoForge・Minecraft）を設定しない（gradle.properties の configure-on-demand）。
      # :mod の評価が混ざったら失敗する（ルートや :core から :mod を参照すると起きる）
      - name: Core-only build does not configure the MOD
        run: |
          ./gradlew :core:test -Ptest.excludeTags=timing --dry-run --info > core-only-config.log
          grep -q "Evaluating project ':core'" core-only-config.log
          if grep -q "Evaluating project ':mod'" core-only-config.log; then echo ":core:test が :mod を設定した"; exit 1; fi

      # :core のテスト。作った .md のリンク・README のコード例のコンパイル（DocConsistencyTest）、層の依存・移植性のラチェット、
      # 差分 / 並列 / ワーカー数の一致テストを含む
      - name: Core tests
        run: ./gradlew :core:test -Ptest.excludeTags=timing --stacktrace --continue

      - name: Summarize test failures
        if: failure()
        run: python3 scripts/ci-summarize-tests.py

      # 新しい JVM・ワーカー 1 本・内蔵書体・描画なしで、1 フレームの確保量と経路の回数（完全一致）を基準値と比べる（memo* カウンタ判定は M0 で撤去）。
      # 確保量の許容は手元が ±5%、ここは ±12%（2 コアの機械では JIT の進み方で実行ごとに ±8% ほど揺れた。近道を 1 つ切ると +100% 以上）。
      # 赤になったら: 意図した変化なら ./gradlew :core:costGate -Pcostgate.update で基準値を更新してコミットする
      - name: Cost gate (allocation and fast-path counters)
        run: ./gradlew :core:costGate -Pcostgate.tolerance=0.12 --stacktrace

      # M0 で新設したメモリ保持量（MB）の回帰ゲート。交互 A/B 遅延（ms）の比は共有ランナーでは同じコミットでも
      # 合否が入れ替わる（4 コアで 0.56〜0.81 倍・0.91〜1.16 倍と揺れた）ので、ここではヒープだけを見る。
      # A/B は開発機の scripts/ci-linux.ps1 -Full・scripts/ab-gate.ps1 で見る
      - name: Memory gate (retained heap)
        run: ./gradlew :core:memoryAndLatencyGate -Pgate.only=heap --stacktrace

      # サーバー側のセッション寿命（ログアウト・サーバー停止で static マップが空に戻るか）は
      # Minecraft を起動しないと確認できないため、ここで専用サーバーを 1 回走らせる。
      # このテストは実際にサーバー停止時のクラッシュを 1 件検出している。
      - name: Game test server
        run: ./gradlew :mod:runGameTestServer --stacktrace
