name: full-tests

# 全テスト（約 3000 件・数分）。毎回の push では回さない（build ワークフローは検査だけ）。
# 手動（Actions → full-tests → Run workflow）と、毎日 1 回（UTC 18:00 = 日本時間 3:00）。
# GPU が無い環境なので GL / Vulkan のテストは中断（skip）になる。書体などの環境差で落ちたテストは、失敗サマリーに出る。
# 開発機での全件確認は scripts/ci-linux.ps1（WSL の Linux で同じ手順）と pre-push フックが担う。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew build test --stacktrace --continue

      # 失敗したテストを注釈（::error）とジョブのサマリーへ出す。ログの取得に権限が要らない形で原因が読める
      - name: Summarize test failures
        if: always()
        run: python3 scripts/ci-summarize-tests.py

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/test-results/test
            core/build/reports/tests/test
            core/build/test-results/test
          if-no-files-found: ignore
          retention-days: 14

  # 時間の推移（A1③）。時間は共有ランナーで ±10〜15% 揺れるので合否には使わない（合否は build.yml の costGate）。
  # JMH の結果（JSON）を毎晩の成果物に残し、後から推移を比べる。
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew

      - name: JMH (pipeline stages, 5 forks)
        run: ./gradlew :core:jmh -Pjmh.args="PipelineBench -p doc=showcase -f 5 -wi 3 -i 5 -rf json -rff core/build/jmh-nightly.json" --stacktrace

      - name: Upload timing
        uses: actions/upload-artifact@v4
        with:
          name: jmh-nightly
          path: core/build/jmh-nightly.json
          if-no-files-found: error
          retention-days: 90
