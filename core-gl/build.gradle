// OpenGL 3.2 Core の GPU バックエンド（:core の GpuBackendProvider 実装）。OpenGL・GLFW のコンパイル依存はここにだけ置く。
plugins {
    id 'java-library'
}

ext.publishDescription = 'OpenGL 3.2 GPU backend for EnderFrameLib core (shares the host GL context, offscreen or window).'

group = engine_group_id
version = engine_version

base {
    archivesName = engine_artifact_prefix + '-core-gl'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

def lwjglVersion = '3.3.3'

dependencies {
    api project(':core')
    api "org.lwjgl:lwjgl-opengl:${lwjglVersion}"
    api "org.lwjgl:lwjgl-glfw:${lwjglVersion}" // コンテキスト用の不可視ウィンドウ
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 公開設定（A10）は archivesName の後で読む
apply from: rootProject.file('gradle/publish-core-module.gradle')
