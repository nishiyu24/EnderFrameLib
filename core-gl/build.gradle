// OpenGL 3.2 Core の GPU バックエンド（:core の GpuBackendProvider 実装）。OpenGL・GLFW のコンパイル依存はここにだけ置く。
plugins {
    id 'java-library'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id + '-core-gl'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

def lwjglVersion = '3.3.3'

dependencies {
    api project(':core')
    api "org.lwjgl:lwjgl-opengl:${lwjglVersion}"
    api "org.lwjgl:lwjgl-glfw:${lwjglVersion}" // コンテキスト用の不可視ウィンドウ
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
